# `postgres` profile. Activate with SPRING_PROFILES_ACTIVE=postgres (or --spring.profiles.active=postgres).
#
# Preferred: set DATABASE_URL=postgres://user:pass@host:port/db (contracts.md format) and
# com.chesterton.ledger.config.DatabaseUrlEnvironmentPostProcessor translates it into the
# spring.datasource.* properties below at startup, but ONLY when this profile is active.
#
# JDBC alternative: if DATABASE_URL is absent/unparseable, set these directly, e.g.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/chesterton
#   SPRING_DATASOURCE_USERNAME=chesterton
#   SPRING_DATASOURCE_PASSWORD=chesterton
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chesterton}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chesterton}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chesterton}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
