spring.application.name=ledger
server.port=4400

# snake_case <-> camelCase for all JSON bodies (contracts.md uses snake_case)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Default profile: H2 in-memory, no external DB required for `./mvnw test` or bare-metal dev.
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
