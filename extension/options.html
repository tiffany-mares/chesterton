<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chesterton — Options</title>
    <style>
      body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; padding: 16px; width: 360px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; color: #57606a; margin-bottom: 4px; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 4px; }
      button { margin-top: 10px; padding: 6px 12px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 4px; background: #f6f8fa; cursor: pointer; }
      #status { margin-left: 8px; font-size: 12px; color: #1a7f37; }
    </style>
  </head>
  <body>
    <h1>Chesterton</h1>
    <label for="gatewayUrl">Gateway base URL</label>
    <input id="gatewayUrl" type="text" placeholder="http://localhost:4000" />
    <div>
      <button id="save">Save</button>
      <span id="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
