name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocks:
    name: mocks (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mocks/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  gateway:
    name: gateway (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  dashboard:
    name: dashboard (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  diff-analyzer:
    name: diff-analyzer (cargo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diff-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          working-directory: diff-analyzer
      - run: cargo test

  verdict:
    name: verdict (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verdict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: verdict/go.sum
      - run: go test ./...

  triage:
    name: triage (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: triage/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest

  seed:
    name: seed (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: seed/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: git config --global user.email "ci@chesterton.local"
      - run: git config --global user.name "chesterton-ci"
      - run: pytest

  ledger:
    name: ledger (mvnw test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ledger/pom.xml
      - name: Make mvnw executable
        run: chmod +x mvnw
      - run: ./mvnw -B test
